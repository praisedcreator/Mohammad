<svg xmlns="http://www.w3.org/2000/svg" width="960" height="730" viewBox="0 0 960 730" role="img" aria-labelledby="title desc"><title id="title">Portfolio architecture overview</title><desc id="desc">Four project flows showing inputs, processing and review outputs.</desc><rect width="100%" height="100%" fill="#F4F7FB"/><rect width="960" height="110" fill="#10243E"/><text x="32" y="45" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FFFFFF" font-weight="700">AI and Cloud Engineering</text><text x="32" y="80" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#8CE6F1" font-weight="400">Python prototypes | source evidence | human review</text><text x="32" y="138" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#182D49" font-weight="700">Delivery support</text><rect x="32" y="155" width="280" height="67" rx="9" fill="#FFFFFF" stroke="#C7D7E8"/><text x="47" y="182" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#182D49" font-weight="400">Order + policy lookup</text><text x="316" y="195" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#087D98" font-weight="700">→</text><rect x="336" y="155" width="280" height="67" rx="9" fill="#FFFFFF" stroke="#C7D7E8"/><text x="351" y="182" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#182D49" font-weight="400">Foundry / Google adapter</text><text x="620" y="195" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#087D98" font-weight="700">→</text><rect x="640" y="155" width="280" height="67" rx="9" fill="#FFFFFF" stroke="#C7D7E8"/><text x="655" y="182" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#182D49" font-weight="400">Validated answer</text><text x="32" y="271" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#182D49" font-weight="700">Inventory decisions</text><rect x="32" y="288" width="280" height="67" rx="9" fill="#FFFFFF" stroke="#C7D7E8"/><text x="47" y="315" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#182D49" font-weight="400">Bounded agent + MCP</text><text x="316" y="328" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#087D98" font-weight="700">→</text><rect x="336" y="288" width="280" height="67" rx="9" fill="#FFFFFF" stroke="#C7D7E8"/><text x="351" y="315" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#182D49" font-weight="400">Deterministic stock</text><text x="351" y="338" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#182D49" font-weight="400">checks</text><text x="620" y="328" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#087D98" font-weight="700">→</text><rect x="640" y="288" width="280" height="67" rx="9" fill="#FFFFFF" stroke="#C7D7E8"/><text x="655" y="315" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#182D49" font-weight="400">Proposal + human review</text><text x="32" y="404" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#182D49" font-weight="700">Retail analytics</text><rect x="32" y="421" width="280" height="67" rx="9" fill="#FFFFFF" stroke="#C7D7E8"/><text x="47" y="448" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#182D49" font-weight="400">BigQuery exception SQL</text><text x="316" y="461" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#087D98" font-weight="700">→</text><rect x="336" y="421" width="280" height="67" rx="9" fill="#FFFFFF" stroke="#C7D7E8"/><text x="351" y="448" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#182D49" font-weight="400">Streamlit + source</text><text x="351" y="471" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#182D49" font-weight="400">drill-down</text><text x="620" y="461" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#087D98" font-weight="700">→</text><rect x="640" y="421" width="280" height="67" rx="9" fill="#FFFFFF" stroke="#C7D7E8"/><text x="655" y="448" font-family="Arial, 