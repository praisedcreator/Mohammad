<svg xmlns="http://www.w3.org/2000/svg" width="960" height="730" viewBox="0 0 960 730" role="img" aria-labelledby="title desc"><title id="title">Cloud and automation project overview</title><desc id="desc">Four project flows covering AWS, Azure, Linux and Python.</desc><rect width="100%" height="100%" fill="#F4F7FB"/><rect width="960" height="110" fill="#10243E"/><text x="32" y="45" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FFFFFF" font-weight="700">Cloud and Automation Projects</text><text x="32" y="80" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#8CE6F1" font-weight="400">AWS | Azure | Linux operations | Python reporting</text><text x="32" y="138" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#182D49" font-weight="700">AWS file intake</text><rect x="32" y="155" width="280" height="67" rx="9" fill="#FFFFFF" stroke="#C7D7E8"/><text x="47" y="182" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#182D49" font-weight="400">S3 upload event</text><text x="316" y="195" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#087D98" font-weight="700">→</text><rect x="336" y="155" width="280" height="67" rx="9" fill="#FFFFFF" stroke="#C7D7E8"/><text x="351" y="182" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#182D49" font-weight="400">Python Lambda validation</text><text x="620" y="195" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#087D98" font-weight="700">→</text><rect x="640" y="155" width="280" height="67" rx="9" fill="#FFFFFF" stroke="#C7D7E8"/><text x="655" y="182" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#182D49" font-weight="400">DynamoDB + failure queue</text><text x="32" y="271" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#182D49" font-weight="700">Azure private storage</text><rect x="32" y="288" width="280" height="67" rx="9" fill="#FFFFFF" stroke="#C7D7E8"/><text x="47" y="315" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#182D49" font-weight="400">Connected client +</text><text x="47" y="338" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#182D49" font-weight="400">identity</text><text x="316" y="328" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#087D98" font-weight="700">→</text><rect x="336" y="288" width="280" height="67" rx="9" fill="#FFFFFF" stroke="#C7D7E8"/><text x="351" y="315" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#182D49" font-weight="400">Private endpoint and DNS</text><text x="620" y="328" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#087D98" font-weight="700">→</text><rect x="640" y="288" width="280" height="67" rx="9" fill="#FFFFFF" stroke="#C7D7E8"/><text x="655" y="315" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#182D49" font-weight="400">Private Blob container</text><text x="32" y="404" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#182D49" font-weight="700">Linux operations</text><rect x="32" y="421" width="280" height="67" rx="9" fill="#FFFFFF" stroke="#C7D7E8"/><text x="47" y="448" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#182D49" font-weight="400">Read-only system metrics</text><text x="316" y="461" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#087D98" font-weight="700">→</text><rect x="336" y="421" width="280" height="67" rx="9" fill="#FFFFFF" stroke="#C7D7E8"/><text x="351" y="448" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#182D49" font-weight="400">Validation and</text><text x="351" y="471" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#182D49" font-weight="400">thresholds</text><text x="620" y="461" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#087D98" font-weight="700">→</text><rect x="640" y="421" width="280" height="67" rx="9" fill="#FFFFFF" stroke="#C7D7E8"/><text x="655" y="448" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#182D49" font-weight="400">JSON + monitoring status</text><text x="32" y="537" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#182D49" font-weight="700">Python automation</text><rect x="32" y="554" width="280" height="67" rx="9" fill="#FFFFFF" stroke="#C7D7E8"/><text x="47" y="581" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#182D49" font-weight="400">Normalized billing CSV</text><text x="316" y="594" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#087D98" font-weight="700">→</text><rect x="336" y="554" width="280" height="67" rx="9" fill="#FFFFFF" stroke="#C7D7E8"/><text x="351" y="581" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#182D49" font-weight="400">Exact decimal</text><text x="351" y="604" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#182D49" font-weight="400">aggregation</text><text x="620" y="594" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#087D98" font-weight="700">→</text><rect x="640" y="554" width="280" height="67" rx="9" fill="#FFFFFF" stroke="#C7D7E8"/><text x="655" y="581" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#182D49" font-weight="400">Monthly budget report</text><text x="32" y="698" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#42556B" font-weight="400">Local tests and template validation; deployment is an optional separate step.</text></svg>
