<svg xmlns="http://www.w3.org/2000/svg" width="960" height="578" viewBox="0 0 960 578" role="img" aria-labelledby="title desc"><title id="title">Actual local demonstration output</title><desc id="desc">The refund policy is cited, and an unrelated question returns insufficient evidence.</desc><rect width="100%" height="100%" fill="#F4F7FB"/><rect width="960" height="105" fill="#10243E"/><text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#FFFFFF" font-weight="700">Guided demo output</text><text x="30" y="78" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#8CE6F1" font-weight="400">Captured from the local Python run | no cloud requests</text><rect x="24" y="135" width="912" height="215" rx="10" fill="#FFFFFF" stroke="#C7D7E8"/><text x="42" y="168" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#182D49" font-weight="700">1. Can the assistant issue a refund?</text><text x="42" y="201" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#087D98" font-weight="700">Status: answered</text><text x="42" y="236" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#182D49" font-weight="400">The lab defines no refund entitlement. A human must review refund requests. The</text><text x="42" y="261" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#182D49" font-weight="400">assistant may recommend an action, but cannot issue a refund, send a message, change</text><text x="42" y="286" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#182D49" font-weight="400">an order or claim that any of those actions happened.</text><text x="42" y="330" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#42556B" font-weight="400">Citations: P007:0000  |  Generation: extractive_local_demo</text><rect x="24" y="374" width="912" height="165" rx="10" fill="#FFFFFF" stroke="#C7D7E8"/><text x="42" y="407" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#182D49" font-weight="700">2. Explain photosynthesis chlorophyll sunlight.</text><text x="42" y="440" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#087D98" font-weight="700">Status: insufficient_evidence</text><text x="42" y="475" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#182D49" font-weight="400">No sufficiently matching policy was found. Ask a human to review the question.</text><text x="42" y="519" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#42556B" font-weight="400">Citations: none  |  Generation: none</text></svg>
